# zlog žurnalo konfigūracija zxeve.
#
# Skaitoma iš zxeve.exe katalogo. Nėra failo - programa veikia toliau, tik
# nerašo žurnalo. Laikas - "%Y-%m-%d %H:%M:%S", ne "%F %T": msvcrt jų
# nepalaiko (žr. grotuvas/conf/zlog.conf).

[global]
strict init = true
buffer min = 1024
buffer max = 64KB
rotate lock file = self
default format = "%d(%Y-%m-%d %H:%M:%S) %-6V %m%n"

[formats]
simple = "%d(%Y-%m-%d %H:%M:%S) %-6V %m%n"

[rules]
# Kategorija "zxeve" = ZLOG_CATEGORY (include/app.h). Šalia .exe, sukasi po
# 1 MB, 3 senesnės kopijos. Smulkmenų nereikia - "zxeve.INFO".
zxeve.*    "zxeve.log", 1MB * 3; simple
