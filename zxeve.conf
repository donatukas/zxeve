# zxeve.conf - zxeve nustatymai (etaloninis failas su aprašais).
#
# Ieškomas šalia zxeve.exe. Programa jį perrašo baigdama darbą (tada
# komentarai dingsta - aprašai lieka šiame faile, conf/zxeve.conf).
# Santykiniai keliai skaičiuojami nuo zxeve.exe katalogo.

# Modelis: 48 | 128 | plus2 | plus2a | plus3 | pentagon.
# ZXRTOS - 128 (ROM'ai roms/128-0.rom ir roms/128-1.rom).
model = "128"

# ROM katalogas (48.rom, 128-0.rom, 128-1.rom ...).
roms = "roms"

# Savas ROM vietoj standartinio arba "" (meniu Mašina -> ZXRTOS / Įkelti
# ROM...). 32 KB failas - 0 ir 1 bankai (ZXRTOS zxrtos-128.rom), 16 KB -
# tik 0 bankas; „...-0.rom“ - 1 bankas imamas iš „...-1.rom“ šalia.
# ZXRTOS išleidimas guli zxrtos\ (zxrtos-128.rom, zxrtos-sd.img).
rom_file = ""

# FT81x EVE (FT813, 800 x 480) išoriniame prievade 0x3F, CS - bitas 5.
ft81x = true

# FT81x backend'as:
#   bt8xxemu - Bridgetek BT8XXEMU (system\bt8xxemu.dll): koprocesorius
#              (CMD_TEXT, CMD_BUTTON ...), ROM šriftai, lietimas pele,
#              INT - IN bitas 5. Veikia realiu laiku.
#   builtin  - libzxemu imitatorius: tik atvaizdavimo sąrašas, be
#              koprocesoriaus, bet kadrų tikslumu.
# Nepavykus paleisti bt8xxemu - klaida (ne tylus perjungimas į builtin).
ft81x_backend = "bt8xxemu"

# Aparatinis SPI registras prievade 0xBF (ZXRTOS 1 variantas).
spi_hw = true

# SD kortelės atvaizdas (.img; ZXRTOS - sd.img su MOD/, LUA/ ...) arba "".
sd_image = ""
sd_readonly = false

# VS1053 audio (SCI CS - bitas 6, SDI - bitas 7, DREQ - IN 6).
vs1053 = false

# LM75 temperatūra, °C (I2C prievadas įjungtas visada).
lm75 = 21.5

# Realus laikas (50 kadrų/s). false - kuo greičiau (BT8XXEMU koprocesorius
# vis tiek dirba realiu laiku).
realtime = true

# Garsas (AY / beeper per garso įrenginį; kadrus tada diktuoja garsas).
audio = true

# ZX ekrano mastelis 1..4 ir FT81x lango mastelis procentais 25..200.
zx_scale = 2
ft_scale = 100

# Greitas juostos įkėlimas: libzxemu gaudyklės (ROM ir savų įkroviklių -
# ROM LD-BYTES kopijų - blokai iš karto), o kol .tap / .tzx groja (ir kol
# renkamas LOAD) - emuliuojama kiek telpa.
# false - realiu laiku, kaip tikra juosta. Meniu Mašina -> Greitas įkėlimas.
tape_fast = true

# Starto efektas (~2 s: juostos krovimo juostos, ZX vaivorykštė, logotipas;
# bet kuris klavišas ar pelė - praleisti). Meniu Rodinys -> Starto efektas.
intro = true

# Derinimo konsolė (spalvotas žurnalas atskirame lange).
debug_console = false

# Paskutinis atidarytas failas (pildo programa).
last_file = ""
